name: Build and Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build Signed Release APK
        env:
          RELEASE_STORE_BASE64: ${{ secrets.RELEASE_STORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
        run: |
          echo "$RELEASE_STORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          cd mobile-android
          RELEASE_STORE_FILE="$RUNNER_TEMP/release.jks" \
          RELEASE_STORE_PASSWORD="$RELEASE_STORE_PASSWORD" \
          gradle assembleRelease
          # Keep the familiar download filename so existing install links keep working.
          cp app/build/outputs/apk/release/app-release.apk app/build/outputs/apk/release/app-debug.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile-android/app/build/outputs/apk/release/app-release.apk

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          files: mobile-android/app/build/outputs/apk/release/app-debug.apk
          tag_name: v1.0.0
          name: "Delay Order Validation Approver APK v1.0.0"
          body: "Official Android APK release for Order Approver mobile application."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

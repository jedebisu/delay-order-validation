<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delay Order Validation - Dispatcher Dashboard</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">
  <div class="min-h-screen flex flex-col">
    <!-- Header -->
    <header class="bg-blue-900 text-white p-4 shadow-md flex justify-between items-center">
      <div>
        <h1 class="text-xl font-bold">Delay Order Validation — Dispatcher Portal</h1>
        <p class="text-xs text-blue-200">Work Order Approval & Delay Tracking</p>
      </div>
      <span class="bg-blue-800 text-xs px-3 py-1 rounded-full border border-blue-700">Dispatcher Portal</span>
    </header>

    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-3 gap-6">
      <!-- Submission Form -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 lg:col-span-1">
        <h2 class="text-lg font-semibold border-b pb-3 mb-4 text-blue-900">New Work Order Request</h2>
        
        <div id="alertMessage" class="hidden mb-4 p-3 rounded text-sm font-medium"></div>

        <form id="requestForm" class="space-y-4">
          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">WORK ORDER NUMBER *</label>
            <input type="text" id="workordernumber" required placeholder="e.g. WO-10029" class="w-full p-2 border rounded-md focus:ring-2 focus:ring-blue-500 focus:border-blue-500 text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">PARTNER *</label>
            <select id="partner" required class="w-full p-2 border rounded-md text-sm bg-white">
              <option value="Ebisu">Ebisu</option>
              <option value="TESCO">TESCO</option>
            </select>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">CHANNEL *</label>
            <select id="channel" required class="w-full p-2 border rounded-md text-sm bg-white">
              <option value="Online">Online</option>
              <option value="Ebisu">Ebisu</option>
              <option value="IPG">IPG</option>
              <option value="Tesco">Tesco</option>
              <option value="WMC">WMC</option>
            </select>
          </div>

          <div class="border-t pt-3">
            <label class="flex items-center space-x-2 text-sm font-semibold cursor-pointer">
              <input type="checkbox" id="with3waynotes" class="rounded text-blue-600 w-4 h-4">
              <span>WITH 3 WAY NOTES</span>
            </label>
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">PERSON 3 WAYED</label>
            <input type="text" id="person3wayed" placeholder="Name of subscriber / contact" class="w-full p-2 border rounded-md text-sm">
          </div>

          <div>
            <label class="block text-xs font-bold text-gray-700 uppercase mb-1">3 WAY NOTES</label>
            <textarea id="threewaynotes" rows="3" placeholder="Specific name, numbers, actual reason of subscriber..." class="w-full p-2 border rounded-md text-sm"></textarea>
          </div>

          <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2.5 rounded-md shadow transition flex justify-center items-center">
            <span>Submit Request</span>
          </button>
        </form>
      </div>

      <!-- Requests Status Board -->
      <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 lg:col-span-2 flex flex-col">
        <div class="flex justify-between items-center border-b pb-3 mb-4">
          <div>
            <h2 class="text-lg font-semibold text-gray-900">Submitted Requests & Live Status</h2>
            <p class="text-xs text-gray-500">Auto-refreshes every 3 seconds</p>
          </div>
          <button onclick="fetchRequests()" class="text-xs bg-gray-100 hover:bg-gray-200 border px-3 py-1.5 rounded font-semibold text-gray-700 flex items-center space-x-1">
            <span>↻ Refresh</span>
          </button>
        </div>

        <div class="overflow-x-auto flex-1">
          <table class="w-full text-left text-sm border-collapse">
            <thead class="bg-gray-50 border-b text-gray-600 uppercase text-xs">
              <tr>
                <th class="p-3">WO #</th>
                <th class="p-3">PARTNER</th>
                <th class="p-3">CHANNEL</th>
                <th class="p-3">STATUS</th>
                <th class="p-3">BDE REMARKS / APPROVER</th>
                <th class="p-3">TIMESTAMP</th>
              </tr>
            </thead>
            <tbody id="requestsTableBody">
              <tr>
                <td colspan="6" class="p-4 text-center text-gray-400">Loading requests...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </main>
  </div>

  <script>
    // Use relative path for seamless Vercel / Local compatibility
    const API_URL = '/api/requests';

    function showAlert(msg, isError = false) {
      const alert = document.getElementById('alertMessage');
      alert.className = `mb-4 p-3 rounded text-sm font-medium ${isError ? 'bg-red-100 text-red-800 border border-red-200' : 'bg-green-100 text-green-800 border border-green-200'}`;
      alert.innerText = msg;
      alert.classList.remove('hidden');
      setTimeout(() => alert.classList.add('hidden'), 4000);
    }

    async function fetchRequests() {
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        const tbody = document.getElementById('requestsTableBody');
        tbody.innerHTML = '';

        if (!Array.isArray(data) || data.length === 0) {
          tbody.innerHTML = '<tr><td colspan="6" class="p-4 text-center text-gray-400">No work order requests submitted yet.</td></tr>';
          return;
        }

        data.forEach(item => {
          const badgeColor = {
            PENDING: 'bg-amber-100 text-amber-800 border-amber-300',
            APPROVED: 'bg-green-100 text-green-800 border-green-300',
            DISAPPROVED: 'bg-red-100 text-red-800 border-red-300',
            DELAYED: 'bg-orange-100 text-orange-800 border-orange-300',
            CANCELLED: 'bg-gray-100 text-gray-800 border-gray-300'
          }[item.status] || 'bg-gray-100';

          const row = document.createElement('tr');
          row.className = 'border-b hover:bg-gray-50';
          row.innerHTML = `
            <td class="p-3 font-bold text-gray-900">${item.workordernumber || item.work_order_number}</td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-xs bg-blue-50 text-blue-700 font-semibold">${item.partner}</span></td>
            <td class="p-3"><span class="px-2 py-0.5 rounded text-xs bg-purple-50 text-purple-700 font-semibold">${item.channel}</span></td>
            <td class="p-3"><span class="px-2.5 py-1 rounded-full text-xs font-bold border ${badgeColor}">${item.status}</span></td>
            <td class="p-3 text-xs">
              ${item.bderemarks || item.bde_remarks ? `<div class="font-medium text-gray-800">${item.bderemarks || item.bde_remarks}</div>` : '<span class="text-gray-400">—</span>'}
              ${item.delaydateandtime || item.delay_date_and_time ? `<div class="text-orange-600 font-semibold mt-0.5">Delayed To: ${new Date(item.delaydateandtime || item.delay_date_and_time).toLocaleString()}</div>` : ''}
              ${item.approverEmail || item.approver_email ? `<div class="text-gray-400 text-[10px]">By: ${item.approverEmail || item.approver_email}</div>` : ''}
            </td>
            <td class="p-3 text-xs text-gray-500">${new Date(item.timestamp).toLocaleString()}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error('Fetch requests error:', err);
      }
    }

    document.getElementById('requestForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.innerText = 'Submitting...';

      try {
        const payload = {
          workordernumber: document.getElementById('workordernumber').value,
          partner: document.getElementById('partner').value,
          channel: document.getElementById('channel').value,
          with3waynotes: document.getElementById('with3waynotes').checked,
          person3wayed: document.getElementById('person3wayed').value,
          threewaynotes: document.getElementById('threewaynotes').value,
        };

        const res = await fetch(API_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });

        if (!res.ok) throw new Error('Submission failed');

        showAlert('✅ Work Order Request submitted successfully!');
        document.getElementById('requestForm').reset();
        fetchRequests();
      } catch (err) {
        showAlert('❌ Failed to submit request. Please try again.', true);
      } finally {
        btn.disabled = false;
        btn.innerText = 'Submit Request';
      }
    });

    fetchRequests();
    setInterval(fetchRequests, 3000);
  </script>
</body>
</html>
